name: Pruebas

# Corre todas las pruebas (incluidas las de integración con Postgres real) en cada cambio.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mediplan
          POSTGRES_PASSWORD: mediplan
          POSTGRES_DB: mediplan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mediplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Las pruebas de integración crean su propia base temporal en este Postgres.
      - run: go test ./... -count=1
      # La imagen de producción también tiene que construirse.
      - run: docker build -t mediplan-api .

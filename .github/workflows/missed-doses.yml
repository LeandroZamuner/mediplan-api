name: Tomas perdidas

# Reemplaza a Cloud Scheduler: llama a la API cada 5 minutos para detectar tomas
# no registradas y avisar a los cuidadores. Además mantiene despierta la API de Render.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ejecutar job de tomas perdidas
        env:
          API_URL: ${{ vars.API_URL }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
        run: |
          test -n "$API_URL" && test -n "$JOB_SECRET" || { echo "Faltan la variable API_URL o el secreto JOB_SECRET"; exit 1; }
          curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 10 \
            -X POST -H "X-Job-Secret: $JOB_SECRET" "$API_URL/internal/jobs/missed-doses"
